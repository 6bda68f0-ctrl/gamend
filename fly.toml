# The app name and the database filename predate the Gamend rename. Changing
# either creates a new Fly app / an empty database instead of reusing the volume.
app = "game-server-uro"
primary_region = "ams"

[build]
  image = "ghcr.io/appsinacup/gamend:latest"

[env]
  GAMEND_HTTP_PORT = "4000"
  GAMEND_DB_SQLITE_PATH = "/data/game_server_prod.db"
  # Uploads and mirrored avatars, on the same volume as the database. The
  # default lives inside the release image, which every deploy replaces.
  GAMEND_STORAGE_DIR = "/data/storage"
  # Games ship their logs here (POST /api/v1/client_logs); off by default.
  GAMEND_CLIENT_LOGS_ENABLED = "true"
  # Per address and minute. The defaults, 10 and 240, throttle Balaur's
  # e2e suite, which runs against gamend.org.
  GAMEND_RATELIMIT_AUTH_LIMIT = "60"
  GAMEND_RATELIMIT_GENERAL_LIMIT = "1200"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  max_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "connections"
    hard_limit = 5000
    soft_limit = 1000

  [[http_service.checks]]
    interval = "30s"
    timeout = "15s"
    grace_period = "30s"
    method = "GET"
    path = "/api/v1/health"

[[vm]]
  size = "shared-cpu-4x"

# The volume also predates the rename and can't be renamed in place.
[[mounts]]
  source = "game_server_data"
  destination = "/data"
